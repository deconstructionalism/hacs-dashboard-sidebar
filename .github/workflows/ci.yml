name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint TypeScript
        run: npm run lint:ts
      - name: Lint CSS-in-JS
        run: npm run lint:css
      - name: Check formatting
        run: npm run format
      - name: Config reference up to date
        run: npm run docs:config:check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser render tests
        run: npm run test:browser

  hacs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # The images check is only required for default-store inclusion; skip
          # it until a screenshot is added to the README.
          ignore: images
